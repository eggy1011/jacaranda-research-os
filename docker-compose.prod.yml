# Production overlay for the internal beta (D-011: applied only after local
# acceptance passes). Usage on the server:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Caddy terminates TLS; set SITE_ADDRESS (e.g. research.example.org) in .env.
services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS in the ignored .env file}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

  web:
    command: ["node_modules/.bin/next", "start", "--hostname", "0.0.0.0"]
    environment:
      APP_ENV: production
    ports: !reset []

  api:
    environment:
      APP_ENV: production
    ports: !reset []

  postgres:
    ports: !reset []

  redis:
    ports: !reset []

volumes:
  caddy_data:
  caddy_config:
