[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jacaranda-api"
version = "0.1.0"
description = "Jacaranda Research OS API"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2",
  "arq>=0.26,<1",
  "asyncpg>=0.30,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "openpyxl>=3.1,<4",
  "pydantic[email]>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "Pillow>=10,<12",
  "pwdlib[argon2]>=0.2,<1",
  "pypdf>=5.1,<7",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.18,<1",
  "python-pptx>=1.0,<2",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
jacaranda-mock-e2e = "jacaranda_api.pipeline.cli:main"
jacaranda-evidence = "jacaranda_api.pipeline.cli_evidence:main"
jacaranda-real-e2e = "jacaranda_api.pipeline.cli_real:main"
jacaranda-invite = "jacaranda_api.auth.cli_invite:main"

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.20,<1",
  "mypy>=1.14,<3",
  "pandas>=2.2,<3",
  "pandas-stubs>=2.2,<3",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
  "types-jsonschema>=4.23,<5",
  "types-openpyxl>=3.1,<4",
]
live = [
  "akshare>=1.14,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=jacaranda_api --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = [
  "akshare",
  "akshare.*",
  "docx",
  "docx.*",
  "openpyxl",
  "openpyxl.*",
  "pandas",
  "pandas.*",
]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["jacaranda_api"]
